name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "dashboard/src/theme.css"
      - "docs/dashboard.png"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling a deploy mid-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build tripcord.dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w site
      - run: npm run build -w site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
