services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tripcord
      POSTGRES_PASSWORD: tripcord
      POSTGRES_DB: tripcord
    ports:
      - "5432:5432"
    volumes:
      - tripcord-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripcord"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://tripcord:tripcord@postgres:5432/tripcord
      PORT: "3000"
      RETENTION_DAYS: "30"
      PUBLIC_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tripcord-postgres-data:
